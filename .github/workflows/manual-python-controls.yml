name: Manual pure Python controls
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Pure controls, installer identity, Windows isolation diagnostic, or owned Native probe
        type: choice
        required: false
        default: pure
        options:
          - pure
          - windows-metadata
          - windows-isolation
          - windows-appcontainer
          - windows-guard-build
          - windows-native
      expected_source_sha:
        description: Guard build expected commit (unused by other modes)
        type: string
        required: false
      expected_protocol_sha:
        description: Guard build protocol hash (unused by other modes)
        type: string
        required: false
permissions:
  contents: read
jobs:
  controls:
    if: ${{ github.event.inputs.probe == '' || github.event.inputs.probe == 'pure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; official ref verified 2026-10-10
        with:
          persist-credentials: false
      - name: Run only platform-independent parsing and filesystem controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p test_adapter.py -v
          python3 -m unittest discover -s tests -p test_validation.py -v
          python3 -m unittest discover -s tests -p test_handoff.py -v
  windows-metadata:
    if: ${{ github.event.inputs.probe == 'windows-metadata' }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and inspect official installer without executing it
        shell: pwsh
        run: ./scripts/windows_toolchain_probe.ps1
  windows-native:
    if: ${{ github.event.inputs.probe == 'windows-native' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pinned official installation and owned Native capability probe
        shell: pwsh
        run: ./scripts/windows_native_slice/bootstrap.ps1
  windows-isolation:
    if: ${{ github.event.inputs.probe == 'windows-isolation' }}
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mock controls and non-admitting owned firewall diagnostic
        shell: pwsh
        run: ./scripts/windows_native_slice/isolation_diagnostic.ps1
  windows-appcontainer:
    if: ${{ github.event.inputs.probe == 'windows-appcontainer' }}
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/windows_native_slice
          sparse-checkout-cone-mode: true
      - name: Non-admitting AppContainer token, TCP and descendant cancellation canary
        shell: pwsh
        run: ./scripts/windows_native_slice/appcontainer_diagnostic.ps1
  windows-guard-build:
    if: ${{ github.event.inputs.probe == 'windows-guard-build' }}
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/windows_native_slice
          sparse-checkout-cone-mode: true
      - name: Build fixed SDK DLL and check null-owner ABI only
        shell: pwsh
        env:
          GUARD_EXPECTED_SOURCE_SHA: ${{ github.event.inputs.expected_source_sha }}
          GUARD_EXPECTED_PROTOCOL_SHA: ${{ github.event.inputs.expected_protocol_sha }}
        run: ./scripts/windows_native_slice/persistent_guard_build.ps1
